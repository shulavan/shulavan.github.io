<style>

#floorPanel h3{margin:0 0 9px;font-size:12px}.floorGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.floorBtn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;border-radius:8px;padding:7px 0;font-size:11px}.floorBtn:active{background:rgba(112,200,255,.22)}

<body>
<div id="app"></div>
<div id="hud">
  <div id="topbar" class="glass"><div id="title">江戸川区新庁舎 3D EXPLORER</div><div id="floorBadge">1F</div></div>
  <div id="mission" class="glass">🎯 <b>ゴール：区長室</b>　庁舎の内部を探検し、11Fの特別職エリアにある区長室を目指そう。</div>
  <div id="mini" class="glass">● 赤：受付・案内<br>● 青：エレベーター<br>● 緑：植物・光庭<br>★：重要スポット</div>
  <div id="cross"></div>
  <div id="hint">左下のジョイスティックで移動　／　画面ドラッグで視点　／　長押しでズーム　／　青いEVボタンをタップ</div>
  <div id="interact"></div>

  <div id="actions"><button id="mapBtn" class="actionBtn">🧭</button><button id="zoomBtn" class="actionBtn">🔍</button><button id="menuBtn" class="actionBtn">☰</button></div>

</div>
<div id="loading"><div class="loadTitle">江戸川区新庁舎</div><div class="loadSub">実施設計資料をもとに、21階建ての探索空間を構築しています</div><div class="bar"><i id="loadBar"></i></div><div class="loadSub" id="loadText">照明・素材・アトリウムを準備中…</div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=s=>document.querySelector(s);
const app=$('#app');
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',stencil:false,depth:true});
const mobileMode=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);renderer.setPixelRatio(Math.min(devicePixelRatio,mobileMode?1.05:1.25));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;app.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x091522);scene.fog=new THREE.Fog(0x091522,18,120);
const camera=new THREE.PerspectiveCamera(73,innerWidth/innerHeight,.05,180);camera.rotation.order='YXZ';
scene.environment=null;

const clock=new THREE.Clock();
const world=new THREE.Group();scene.add(world);
const staticColliders=[];const stairs=[];const doors=[];const interactables=[];const people=[];const elevators=[];const elevatorVisuals=[];
const mat={
 concrete:new THREE.MeshStandardMaterial({color:0x9eaaa9,roughness:.82,metalness:.04}),
 white:new THREE.MeshStandardMaterial({color:0xe7ecea,roughness:.72}),
 wall:new THREE.MeshStandardMaterial({color:0xdfe5e4,roughness:.8}),
 glass:new THREE.MeshStandardMaterial({color:0x8ac8df,roughness:.18,metalness:.08,transparent:true,opacity:.36}),
 darkGlass:new THREE.MeshStandardMaterial({color:0x143044,roughness:.12,metalness:.38,transparent:true,opacity:.82}),
 steel:new THREE.MeshStandardMaterial({color:0x6b7680,roughness:.35,metalness:.8}),
 wood:new THREE.MeshStandardMaterial({color:0x9b6a44,roughness:.58}),
 wood2:new THREE.MeshStandardMaterial({color:0x6f4a31,roughness:.68}),
 green:new THREE.MeshStandardMaterial({color:0x426c44,roughness:.9}),
 leaf:new THREE.MeshStandardMaterial({color:0x5e8a59,roughness:.86}),
 blue:new THREE.MeshStandardMaterial({color:0x2f88b7,roughness:.34,metalness:.28,emissive:0x0c2130,emissiveIntensity:.2}),
 screen:new THREE.MeshStandardMaterial({color:0x13253d,roughness:.25,metalness:.25,emissive:0x0c4d7b,emissiveIntensity:1.15}),
 red:new THREE.MeshStandardMaterial({color:0x9d3b3b,roughness:.42}),
 floor:new THREE.MeshStandardMaterial({color:0xbcc2c2,roughness:.72}),
 tile:new THREE.MeshStandardMaterial({color:0xd8dddc,roughness:.58}),
 stair:new THREE.MeshStandardMaterial({color:0x7d8586,roughness:.7}),
 gold:new THREE.MeshStandardMaterial({color:0xc7a85a,roughness:.3,metalness:.55}),
 black:new THREE.MeshStandardMaterial({color:0x161c20,roughness:.62}),
 skin:new THREE.MeshStandardMaterial({color:0xd0a483,roughness:.86}),
 tactile:mat.tactile,
 bench:new THREE.MeshStandardMaterial({color:0x8a684d,roughness:.72})
};
const W=36,D=44,LOWW=52,LOWD=48,H=4.1;

function box(name,x,y,z,sx,sy,sz,material,collide=true,parent=world){const g=new THREE.BoxGeometry(sx,sy,sz);const m=material||mat.white;const o=new THREE.Mesh(g,m);o.name=name;o.position.set(x,y,z);o.castShadow=sy>0.3;o.receiveShadow=true;parent.add(o);if(collide){const fy=(Math.abs(y)>0.5?Math.max(1,Math.min(21,Math.round((y-sy/2)/H)+1)):0);staticColliders.push({min:new THREE.Vector3(x-sx/2,y-sy/2,z-sz/2),max:new THREE.Vector3(x+sx/2,y+sy/2,z+sz/2),obj:o,floor:fy});}return o}
function cyl(name,x,y,z,r,h,material,parent=world,seg=16){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),material);o.name=name;o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function roundedBox(x,y,z,sx,sy,sz,material,r=.08){const shape=new THREE.Shape();const w=sx,h=sz;const q=r;shape.moveTo(-w/2+q,-h/2);shape.lineTo(w/2-q,-h/2);shape.quadraticCurveTo(w/2,-h/2,w/2,-h/2+q);shape.lineTo(w/2,h/2-q);shape.quadraticCurveTo(w/2,h/2,w/2-q,h/2);shape.lineTo(-w/2+q,h/2);shape.quadraticCurveTo(-w/2,h/2,-w/2,h/2-q);shape.lineTo(-w/2,-h/2+q);shape.quadraticCurveTo(-w/2,-h/2,-w/2+q,-h/2);const geo=new THREE.ExtrudeGeometry(shape,{depth:sy,bevelEnabled:true,bevelSegments:2,bevelSize:r,bevelThickness:r});const o=new THREE.Mesh(geo,material);o.rotation.x=-Math.PI/2;o.position.set(x,y-sy/2,z);o.castShadow=true;o.receiveShadow=true;world.add(o);return o}

function addFloorSlab(floor,w=W,d=D){const y=(floor-1)*H;box('floor',0,y-0.16,0,w,.32,d,mat.floor,false);box('ceiling',0,y+H-.14,0,w,.28,d,mat.white,false)}
function addWallsForFloor(floor){const y=(floor-1)*H+H/2;const w=floor<=4?LOWW:W,d=floor<=4?LOWD:D;
  box('northWall',0,y,-d/2,w,.3,.3,mat.wall,true);box('southWall',0,y,d/2,w,.3,.3,mat.wall,true);box('westWall',-w/2,y,0,.3,H,d,mat.wall,true);box('eastWall',w/2,y,0,.3,H,d,mat.wall,true);
}
function addRoom(x,z,sx,sz,floor,label,opts={}){const y=(floor-1)*H;const h=H-0.24;const depth=.18;
  if(opts.closed!==false){
    // All rooms have a real doorway. The front wall is split around a 1.7m opening.
    const opening=1.7; const frontZ=z-sz/2; const side=(sx-opening)/2;
    if(side>0.2){box(label+' front L',x-(opening+side)/2,y+h/2,frontZ,side,h,depth,mat.wall,true);box(label+' front R',x+(opening+side)/2,y+h/2,frontZ,side,h,depth,mat.wall,true)}
    box(label+' wall B',x,y+h/2,z+sz/2,sx,h,depth,mat.wall,true);box(label+' wall L',x-sx/2,y+h/2,z,depth,h,sz,mat.wall,true);box(label+' wall R',x+sx/2,y+h/2,z,depth,h,sz,mat.wall,true);
    const door=box(label+' door',x,y+1.1,frontZ+.04,opening,2.2,.10,mat.darkGlass,true);
    const collider=staticColliders[staticColliders.length-1]; collider.kind='door'; collider.blocked=true;
    const doorState={open:false,door,collider,baseX:x,baseZ:frontZ+.04};
    interactables.push({type:'door',object:door,label,position:new THREE.Vector3(x,y+1.05,frontZ-.6),action:()=>{doorState.open=!doorState.open;collider.blocked=!doorState.open;doorState.door.visible=!doorState.open;toast(label+(doorState.open?'：開きました':'：閉じました'));}});
  }
  const sign=cyl('roomSign',x,y+2.15,z-sz/2-.09,.06,.22,mat.red);sign.rotation.x=Math.PI/2;interactables.push({type:'room',object:sign,label,position:new THREE.Vector3(x,y+1.2,z-sz/2-.9),action:()=>toast(label+' を探索できます')});
}

function addCeilingLights(floor,positions){const y=(floor-1)*H+H-.34;for(const [x,z] of positions){const light= new THREE.RectAreaLight(0xffffff,1.8,3.2,0.4);light.position.set(x,y,z);light.rotation.x=-Math.PI/2;world.add(light);box('light',x,y-.02,z,3.0,.04,.34,new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:2.2}),false)}}

// exterior massing / podium and tower, built from the implementation design: 21F, approx. 99m, lower green/horizontal podium, vertical upper volume
function buildMassing(){
  // Fast-start shell: do not synchronously create 21 interior slabs.
  // Interior floors are streamed after the player can already move.
  box('podium-core',0,1.9,0,LOWW,3.8,LOWD,mat.concrete,false);
  const towerGroup=new THREE.Group();towerGroup.name='vertical-tower';world.add(towerGroup);
  for(let i=-5;i<=5;i++){const x=i*3.0;box('facadeFin',x,43.0,-22.9,.22,82,.22,mat.steel,false,towerGroup);box('facadeFin',x,43.0,22.9,.22,82,.22,mat.steel,false,towerGroup)}
}

function buildPodiumAndAtrium(){
  // 1F main entrance hall, atrium, community hall, multi-purpose areas
  const y=0;
  // floor 1 shell is opened at south face, entrance side, but inaccessible exterior via invisible boundary beyond glazing
  box('1F left wing wall',-24,2.0,0,5.2,4,38,mat.wall,true);
  box('1F right wing wall',24,2.0,0,5.2,4,38,mat.wall,true);
  // atrium boundaries
  box('atrium west glass',-12,2,0,.16,3.9,39,mat.glass,true);box('atrium east glass',12,2,0,.16,3.9,39,mat.glass,true);
  // main glass curtainwall at entrance
  box('entry glass',0,2,-21.7,22,3.7,.18,mat.glass,true);
  // reception
  box('reception desk',0,1.15,-16,8,.8,1.5,mat.wood2,false);
  box('reception counter',0,1.65,-15.25,8,.12,.35,mat.gold,false);
  makeReceptionist(0,1,-14.65,'受付');
  // multi-purpose hall / community space
  addRoom(-18,12,9,16,1,'多目的スペースA');
  addRoom(18,12,9,16,1,'多目的スペースB');
  addRoom(-18,-10,9,14,1,'防災センター');
  // central lounge / light garden below atrium
  makeLightGarden(0,4,4.6);
  makeSign(0,3.0,-18,'総合案内 / ENTRANCE HALL');
  // cafe/convenience tenant zone
  addRoom(18,-10,9,11,1,'売店・飲食コーナー');
  // lighting
  addCeilingLights(1,[[-18,-6],[-18,10],[18,-8],[18,8],[0,-12],[0,13]]);
  makeDigitalSign(0,2.15,-12,'江戸川区へようこそ','WELCOME TO EDOGAWA');
}
function makeLightGarden(x,z,r){const y=.2;const basin=cyl('光庭水景',x,y,z,r,.18,new THREE.MeshStandardMaterial({color:0x5fa6b8,roughness:.15,metalness:.05}));cyl('光庭 island',x,y+.22,z,r*.62,.28,mat.concrete);cyl('シンボルツリー trunk',x,y+1.9,z,.34,3.3,mat.wood2);for(let i=0;i<18;i++){const a=i*Math.PI*2/18;const rr=.75+.22*Math.sin(i*1.7);const leaf=cyl('leaf',x+Math.cos(a)*rr,y+3.5+Math.sin(i)*.13,z+Math.sin(a)*rr,.38,.45,mat.leaf);leaf.scale.z=.65} }
function makeSign(x,y,z,a,b){const plate=box('sign',x,y,z,6,.55,.16,mat.darkGlass,false);const c=document.createElement('canvas');c.width=900;c.height=180;const ctx=c.getContext('2d');ctx.fillStyle='#173245';ctx.fillRect(0,0,900,180);ctx.fillStyle='#eaf6ff';ctx.font='bold 48px sans-serif';ctx.textAlign='center';ctx.fillText(a,450,72);ctx.fillStyle='#8dd6ff';ctx.font='bold 30px sans-serif';ctx.fillText(b,450,126);plate.material=new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(c),roughness:.5,emissive:0x132b39,emissiveIntensity:.7});return plate}
function makeDigitalSign(x,y,z,jp,en){const p=makeSign(x,y,z,jp,en);p.scale.set(1.4,1.0,1);return p}

function buildLevels(){
  // 2F: citizen services, atrium balcony, terrace
  const specs=[
    {f:2,rooms:[[-14,10,8,16,'区民サービス窓口'],[15,11,8,15,'相談フロア'],[-15,-10,8,13,'証明・申請窓口'],[15,-10,8,13,'多目的スペース']],lights:[[-15,-8],[-15,9],[15,-8],[15,9]]},
    {f:3,rooms:[[-15,10,8,15,'保健所受付'],[15,10,8,15,'健康相談'],[-15,-10,8,13,'子育て支援'],[15,-10,8,13,'市民活動スペース']],lights:[[-15,-8],[-15,9],[15,-8],[15,9]]},
    {f:4,rooms:[[-15,10,8,15,'保健所機能'],[15,10,8,15,'健診・相談'],[-15,-10,8,13,'保健所会議室'],[15,-10,8,13,'多目的スペース']],lights:[[-15,-8],[-15,9],[15,-8],[15,9]]}
  ];
  for(const s of specs){for(const r of s.rooms)addRoom(r[0],r[1],r[2],r[3],s.f,r[4]);addCeilingLights(s.f,s.lights);makeBalcony(s.f)}
  // 5-10, 12-19: flexible office floors with 7.2m modules, core-centered open plan
  for(let f=5;f<=19;f++) if(f!==11) buildOfficeFloor(f);
  // 11F: disaster response + ward executive suite, goal lives here
  buildDisasterFloor(11);
  // 20-21 assembly zone
  buildAssemblyFloor(20);buildAssemblyFloor(21);
  // rooftop helipad and mechanical rooftop equipment, accessible only as optional visual via elevator locked
  makeHelipad(21);
}
function makeBalcony(f){const y=(f-1)*H+1.5;box('balcony rail',0,y,-22,22,.9,.18,mat.glass,false);for(let x=-9;x<=9;x+=3)box('balcony planter',x,y-.35,-21.6,2.1,.34,.5,mat.wood2,false),cyl('balcony plant',x,y+.2,-21.6,.2,.6,mat.leaf,world)}
function buildOfficeFloor(f){const y=(f-1)*H;for(const x of [-13,-6,6,13]){box('office pod wall',x,y+H/2,0,5.9,H-.25,.18,mat.wall,true)};for(let z of [-15,15])box('office boundary',0,y+H/2,z,34,H-.25,.18,mat.wall,true);
  // core enclosure and equipment
  box('core west',-4.8,y+H/2,0,.18,H-0.25,18,mat.wall,true);box('core east',4.8,y+H/2,0,.18,H-0.25,18,mat.wall,true);
  const deskCount=mobileMode?8:10;for(let r=0;r<deskCount;r++){const x=(r%5)*3.6-7.2;const z=(Math.floor(r/5))*8-4;makeDesk(x,y+1.05,z,f%2?0x566b76:0x3e5a67);if(r%2===0)makeOfficePerson(x+.55,y+1.05,z+.35,f+r)}
  makeCopyZone(-13,y+0.9,-15);addCeilingLights(f,[[-12,-12],[-12,0],[-12,12],[12,-12],[12,0],[12,12]]);

function streamNextFloor(){
