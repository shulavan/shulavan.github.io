<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎡ダイヤと花の大観覧車</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            text-align: center;
            background-color: #0d47a1;
            margin: 0;
            padding: 0;
            user-select: none;
            overflow: hidden;
            color: #333;
        }
        #app-container {
            max-width: 480px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #fff;
            position: relative;
        }
        #hud {
            background: linear-gradient(135deg, #0288d1, #01579b);
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 5;
        }
        .hud-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            background: #87ceeb;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #controls {
            padding: 15px;
            background: #f5f5f5;
            border-top: 2px solid #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        .btn-stop {
            width: 85%;
            max-width: 300px;
            padding: 16px 0;
            font-size: 24px;
            font-weight: 900;
            color: white;
            background: linear-gradient(180deg, #ff5252, #d50000);
            border: none;
            border-radius: 50px;
            box-shadow: 0 6px 0 #9b0000, 0 10px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.05s ease;
            letter-spacing: 2px;
        }
        .btn-stop:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #9b0000, 0 4px 5px rgba(0,0,0,0.2);
        }
        .btn-stop:disabled {
            background: #b0bec5;
            box-shadow: 0 4px 0 #78909c;
            opacity: 0.7;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: white;
            width: 88%;
            max-width: 380px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            animation: modalUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalUp {
            from { transform: scale(0.8) translateY(20px); }
            to { transform: scale(1) translateY(0); }
        }
        .modal-header {
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: white;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
        }
        .modal-body {
            padding: 20px;
            font-size: 15px;
            line-height: 1.6;
            color: #424242;
            text-align: left;
        }
        .modal-footer {
            padding: 12px 20px 18px;
            background: #fafafa;
            border-top: 1px solid #eee;
        }
        .btn-close {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: #26a69a;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 3px 0 #00796b;
        }
        .btn-close:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #00796b;
        }
        .timer-text {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
            text-align: center;
        }
        .result-highlight {
            font-size: 18px;
            font-weight: bold;
            color: #d32f2f;
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            background: #ffebee;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- HUD -->
    <div id="hud">
        <div class="hud-item">💰 <span id="money-display">￥100,000</span></div>
        <div class="hud-item">⚡ 速度: <span id="speed-display">10</span>x</div>
        <div class="hud-item">👤 乗客: <span id="passenger-count">0</span>/5</div>
    </div>

    <!-- Main Canvas -->
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Controls -->
    <div id="controls">
        <button id="stop-btn" class="btn-stop">ストップ！</button>
    </div>

    <!-- Start Modal -->
    <div id="start-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">🎡ダイヤと花の大観覧車</div>
            <div class="modal-body">
                🎡 <b>ゲームルール</b><br>
                ・高速回転する観覧車を止めよう！<br>
                ・画面下の客が指定する色と同じゴンドラが一番下（乗り場）に来たら「ストップ」！<br>
                ・5人中 <b>3人以上</b> 乗せられたら成功！<br>
                ・人数が進むと観覧車のスピードが変化します。
            </div>
            <div class="modal-footer">
                <button id="start-close-btn" class="btn-close">閉じる</button>
                <div class="timer-text"><span id="start-timer">3</span> 秒後に自動でスタートします</div>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header" id="result-title">結果発表</div>
            <div class="modal-body" id="result-body">
                <!-- Dynamic Content -->
            </div>
            <div class="modal-footer">
                <button id="result-close-btn" class="btn-close">閉じる</button>
                <div class="timer-text"><span id="result-timer">5</span> 秒後に自動で戻ります</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ゴンドラの8色定義
    const GONDOLA_COLORS = [
        { name: '赤', hex: '#FF2A6D' },
        { name: '青', hex: '#0056FF' },
        { name: '黄', hex: '#FFC800' },
        { name: '緑', hex: '#05D550' },
        { name: '紫', hex: '#9D00FF' },
        { name: '橙', hex: '#FF7000' },
        { name: '桃', hex: '#FF66C4' },
        { name: '水色', hex: '#00D2FF' }
    ];

    const CHARACTERS = ['👧', '🧒', '👶', '👦'];
    const BASE_ANGULAR_SPEED = 0.005;

    // ゲーム状態変数
    let money = 100000;
    let currentPassengerIndex = 0;
    let successCount = 0;
    let currentSpeedMultiplier = 10;
    let angle = 0;
    let isSpinning = true;
    let isEvaluating = false;

    // 現在の乗客情報
    let currentCustomer = {
        emoji: '👧',
        targetColor: GONDOLA_COLORS[0],
        x: -50,
        targetX: 60,
        y: 0,
        status: 'waiting',
        bubbleText: ''
    };

    let fluctuationInterval = null;
    let autoCloseTimer = null;

    // DOM要素参照
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const moneyDisplay = document.getElementById('money-display');
    const speedDisplay = document.getElementById('speed-display');
    const passengerCountDisplay = document.getElementById('passenger-count');
    const stopBtn = document.getElementById('stop-btn');

    const startModal = document.getElementById('start-modal');
    const resultModal = document.getElementById('result-modal');

    function resizeCanvas() {
        const container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        currentCustomer.y = canvas.height - 45;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function showStartModal() {
        startModal.classList.add('active');
        let countdown = 3;
        document.getElementById('start-timer').textContent = countdown;

        clearInterval(autoCloseTimer);
        autoCloseTimer = setInterval(() => {
            countdown--;
            document.getElementById('start-timer').textContent = countdown;
            if (countdown <= 0) {
                closeStartModal();
            }
        }, 1000);
    }

    function closeStartModal() {
        clearInterval(autoCloseTimer);
        startModal.classList.remove('active');
        resetGameRound();
    }

    document.getElementById('start-close-btn').addEventListener('click', closeStartModal);

    function showResultModal() {
        resultModal.classList.add('active');
        
        const missCount = 5 - successCount;
        const missPenalty = missCount * 2000;
        const isClear = successCount >= 3;
        const bonus = isClear ? 10000 : 0;
        
        money = money + bonus - missPenalty;
        moneyDisplay.textContent = `￥${money.toLocaleString()}`;

        const resultTitle = document.getElementById('result-title');
        const resultBody = document.getElementById('result-body');

        resultTitle.textContent = isClear ? '🎉 SUCCESS! クリア！' : '😭 GAME OVER 失敗...';
        resultTitle.style.background = isClear ? 'linear-gradient(135deg, #4caf50, #2e7d32)' : 'linear-gradient(135deg, #f44336, #c62828)';

        resultBody.innerHTML = `
            乗車成功人数: <b>${successCount} / 5 人</b><br>
            ${isClear ? '🎁 クリアボーナス: <b>+￥10,000</b><br>' : ''}
            ${missCount > 0 ? `💸 ミス発生（${missCount}人）: <b style="color:#d32f2f;">-￥${missPenalty.toLocaleString()}</b><br>` : ''}
            <div class="result-highlight">
                現在の所持金: ￥${money.toLocaleString()}
            </div>
        `;

        let countdown = 5;
        document.getElementById('result-timer').textContent = countdown;

        clearInterval(autoCloseTimer);
        autoCloseTimer = setInterval(() => {
            countdown--;
            document.getElementById('result-timer').textContent = countdown;
            if (countdown <= 0) {
                closeResultModal();
            }
        }, 1000);
    }

    function closeResultModal() {
        clearInterval(autoCloseTimer);
        resultModal.classList.remove('active');
        showStartModal();
    }

    document.getElementById('result-close-btn').addEventListener('click', closeResultModal);

    function resetGameRound() {
        currentPassengerIndex = 0;
        successCount = 0;
        isSpinning = true;
        isEvaluating = false;
        passengerCountDisplay.textContent = '0';
        setupPassenger(0);
    }

    function setupPassenger(index) {
        currentPassengerIndex = index;
        passengerCountDisplay.textContent = `${index + 1}`;
        isSpinning = true;
        isEvaluating = false;
        stopBtn.disabled = false;

        const emoji = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
        const targetColor = GONDOLA_COLORS[Math.floor(Math.random() * GONDOLA_COLORS.length)];
        
        currentCustomer = {
            emoji: emoji,
            targetColor: targetColor,
            x: -50,
            targetX: 65,
            y: canvas.height - 45,
            status: 'waiting',
            bubbleText: `${targetColor.name}に乗りたい`
        };

        // 速度管理ルール
        clearInterval(fluctuationInterval);
        if (index === 0) {
            currentSpeedMultiplier = 10;
        } else if (index === 1) {
            currentSpeedMultiplier = 12;
        } else if (index === 2) {
            updateFluctuatingSpeed();
            fluctuationInterval = setInterval(updateFluctuatingSpeed, 1000);
        } else if (index === 3) {
            currentSpeedMultiplier = 10;
        } else {
            currentSpeedMultiplier = 12;
        }

        speedDisplay.textContent = currentSpeedMultiplier;
    }

    function updateFluctuatingSpeed() {
        if (currentPassengerIndex === 2 && isSpinning) {
            currentSpeedMultiplier = Math.floor(Math.random() * 6) + 5; // 5~10
            speedDisplay.textContent = currentSpeedMultiplier;
        }
    }

    stopBtn.addEventListener('click', () => {
        if (!isSpinning || isEvaluating) return;
        
        isSpinning = false;
        isEvaluating = true;
        stopBtn.disabled = true;
        clearInterval(fluctuationInterval);

        const gondolaCount = GONDOLA_COLORS.length;
        const targetAngle = Math.PI / 2; // 真下（乗車位置）

        let minDiff = Infinity;
        let selectedColor = null;

        for (let i = 0; i < gondolaCount; i++) {
            let gondolaAngle = (angle + (i * (Math.PI * 2 / gondolaCount))) % (Math.PI * 2);
            if (gondolaAngle < 0) gondolaAngle += Math.PI * 2;

            let diff = Math.abs(gondolaAngle - targetAngle);
            if (diff > Math.PI) diff = Math.PI * 2 - diff;

            if (diff < minDiff) {
                minDiff = diff;
                selectedColor = GONDOLA_COLORS[i];
            }
        }

        // 判定処理
        if (selectedColor.name === currentCustomer.targetColor.name) {
            successCount++;
            currentCustomer.status = 'success';
            currentCustomer.bubbleText = '♪';
        } else {
            currentCustomer.status = 'failed';
            currentCustomer.bubbleText = '💢';
        }

        setTimeout(() => {
            if (currentPassengerIndex + 1 < 5) {
                setupPassenger(currentPassengerIndex + 1);
            } else {
                showResultModal();
            }
        }, 1800);
    });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const width = canvas.width;
        const height = canvas.height;

        // 地面の位置
        const groundY = height - 60;

        // ゴンドラサイズをさらに2倍（特大化）
        const gondolaRadius = 60;
        const gondolaCenterY = 20;

        // 観覧車半径
        const radius = Math.min(width * 0.40, height * 0.28);

        // 一番下のゴンドラが地面すれすれに着くように中心Yを設定
        const centerY = groundY - radius - gondolaCenterY - gondolaRadius + 5;
        const centerX = width / 2;

        // --- A. 背景 (空グラデーション) ---
        let bgGrad = ctx.createLinearGradient(0, 0, 0, height);
        bgGrad.addColorStop(0, '#4fc3f7');
        bgGrad.addColorStop(0.6, '#e0f7fa');
        bgGrad.addColorStop(1, '#ffffff');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        // --- B. 地面・花畑 ---
        ctx.fillStyle = '#7cb342';
        ctx.fillRect(0, groundY, width, height - groundY);

        ctx.fillStyle = '#689f38';
        ctx.beginPath();
        ctx.ellipse(width / 2, groundY + 10, width * 0.7, 40, 0, 0, Math.PI * 2);
        ctx.fill();

        // 花々
        const flowerColors = ['#e91e63', '#ff1744', '#9c27b0', '#ffffff', '#ff9800'];
        for (let i = 0; i < 35; i++) {
            let fx = (Math.sin(i * 99) * 0.5 + 0.5) * width;
            let fy = groundY + 15 + (Math.cos(i * 33) * 0.5 + 0.5) * 35;
            ctx.fillStyle = flowerColors[i % flowerColors.length];
            ctx.beginPath();
            ctx.arc(fx, fy, 4 + (i % 3), 0, Math.PI * 2);
            ctx.fill();
        }

        // --- C. 観覧車の支柱 ---
        ctx.strokeStyle = '#cfd8dc';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX - radius * 0.55, groundY);
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + radius * 0.55, groundY);
        ctx.stroke();

        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(centerX - radius * 0.3, centerY + (groundY - centerY) * 0.55);
        ctx.lineTo(centerX + radius * 0.3, centerY + (groundY - centerY) * 0.55);
        ctx.stroke();

        // --- D. 観覧車回転軸 ---
        if (isSpinning) {
            angle += BASE_ANGULAR_SPEED * currentSpeedMultiplier;
        }

        const gondolaCount = GONDOLA_COLORS.length;

        // ホイールリング
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius * 0.65, 0, Math.PI * 2);
        ctx.arc(centerX, centerY, radius * 0.3, 0, Math.PI * 2);
        ctx.stroke();

        // スポークと2倍特大ゴンドラ
        for (let i = 0; i < gondolaCount; i++) {
            let gondolaAngle = angle + (i * (Math.PI * 2 / gondolaCount));
            let gx = centerX + radius * Math.cos(gondolaAngle);
            let gy = centerY + radius * Math.sin(gondolaAngle);

            // スポーク
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(gx, gy);
            ctx.stroke();

            // 特大ゴンドラ
            ctx.save();
            ctx.translate(gx, gy);

            // アーム
            ctx.strokeStyle = '#78909c';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, gondolaCenterY);
            ctx.stroke();

            // 客車本体（ドーム型）
            const col = GONDOLA_COLORS[i];
            
            // 外形本体
            ctx.fillStyle = col.hex;
            ctx.beginPath();
            ctx.arc(0, gondolaCenterY, gondolaRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();

            // 屋根のフチ飾り
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(0, gondolaCenterY - gondolaRadius + 10, gondolaRadius - 6, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // 窓 (大きな窓)
            ctx.fillStyle = '#e0f7fa';
            ctx.beginPath();
            ctx.arc(0, gondolaCenterY, gondolaRadius * 0.55, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 色の名前テキスト (特大表示で視認性向上)
            ctx.fillStyle = '#111111';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(col.name, 0, gondolaCenterY);

            ctx.restore();
        }

        // 中心軸
        ctx.fillStyle = '#0288d1';
        ctx.beginPath();
        ctx.arc(centerX, centerY, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.stroke();

        // --- E. キャラクター & 吹き出し描画 ---
        if (currentCustomer.status === 'waiting') {
            currentCustomer.x += (currentCustomer.targetX - currentCustomer.x) * 0.15;
        } else if (currentCustomer.status === 'success') {
            // 地上のゴンドラへ乗り込み
            currentCustomer.x += (centerX - currentCustomer.x) * 0.1;
            currentCustomer.y += (centerY + radius + gondolaCenterY - currentCustomer.y) * 0.1;
        } else if (currentCustomer.status === 'failed') {
            currentCustomer.x -= 7;
        }

        const cx = currentCustomer.x;
        const cy = currentCustomer.y;

        // キャラクター本体
        ctx.font = '48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(currentCustomer.emoji, cx, cy);

        // 吹き出し描画 (一体化パスにより黒線・歪みを完全解消)
        if (cx > 10) {
            ctx.save();
            ctx.font = 'bold 16px sans-serif';
            const textMetrics = ctx.measureText(currentCustomer.bubbleText);
            const bubbleWidth = textMetrics.width + 28;
            const bubbleHeight = 38;
            
            // 吹き出し位置（画面端からはみ出さないよう調整）
            const bx = Math.max(10, Math.min(cx - bubbleWidth / 2, width - bubbleWidth - 10));
            const by = cy - 85;

            const r = 10;
            // キャラクター頭上へ向かう三角しっぽの先端座標
            const xt = Math.max(bx + 15, Math.min(cx, bx + bubbleWidth - 15));
            const yt = cy - 36;
            const x1 = xt - 10;
            const x2 = xt + 10;

            // 角丸四角形と三角しっぽを単一の連続パスとして描画
            ctx.beginPath();
            ctx.moveTo(bx + r, by);
            ctx.lineTo(bx + bubbleWidth - r, by);
            ctx.arcTo(bx + bubbleWidth, by, bx + bubbleWidth, by + r, r);
            ctx.lineTo(bx + bubbleWidth, by + bubbleHeight - r);
            ctx.arcTo(bx + bubbleWidth, by + bubbleHeight, bx + bubbleWidth - r, by + bubbleHeight, r);
            ctx.lineTo(x2, by + bubbleHeight);
            ctx.lineTo(xt, yt);
            ctx.lineTo(x1, by + bubbleHeight);
            ctx.lineTo(bx + r, by + bubbleHeight);
            ctx.arcTo(bx, by + bubbleHeight, bx, by + bubbleHeight - r, r);
            ctx.lineTo(bx, by + r);
            ctx.arcTo(bx, by, bx + r, by, r);
            ctx.closePath();

            // 白塗りつぶし＋黒枠線でクッキリと描画
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // 吹き出しテキスト
            ctx.fillStyle = currentCustomer.status === 'failed' ? '#d32f2f' : '#111111';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(currentCustomer.bubbleText, bx + bubbleWidth / 2, by + bubbleHeight / 2);
            ctx.restore();
        }

        requestAnimationFrame(draw);
    }

    // ゲーム起動
    showStartModal();
    draw();

</script>
</body>
</html>
